name: Lint

on:
  push:
    branches: [master, main, greenfield]
  pull_request:
  workflow_dispatch:

jobs:
  shell-lint:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Lint shell scripts
        run: ./bin/dot lint
