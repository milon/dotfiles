# mise global configuration
# https://mise.jdx.dev/configuration.html
#
# Languages are pinned to majors (or LTS channels) for reproducible machines.
# Package managers stay on "latest" so lockfiles drive the exact version.

[tools]
bun = "latest"
node = "26"
pnpm = "latest"
python = "3.15"
ruby = "4.0"
java = "corretto-25"
go = "1.27"
rust = "stable"

[settings]
# Enable idiomatic version files (.nvmrc, .python-version, .go-version, etc.)
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "go"]
color_theme = "catppuccin"

[settings.ruby]
compile = false
