# Sheldon — https://sheldon.cli.rs
# Locked clones live under ~/.local/share/sheldon/
#
# LOAD ORDER MATTERS — sourced top-to-bottom. Do not reorder casually:
#   1. env / path / options
#   2. fzf opts (before fzf init)
#   3. completion defs on fpath → compinit
#   4. autosuggestions / other ZLE wrappers
#   5. syntax-highlighting (last among ZLE wrappers)
#   6. aliases, mise, fzf, zoxide, starship
#   7. keybindings (after everything that calls bindkey)
shell = "zsh"

# ── Environment (needs DOTFILES_DIR from ~/.zshrc) ───────────────────────
[plugins.env]
inline = """
setopt AUTO_CD
export EDITOR='nvim'
export GREP_OPTIONS='--color=auto'
export STARSHIP_CONFIG="$DOTFILES_DIR/files/home/starship.toml"
export PATH="$PATH:$HOME/.composer/vendor/bin:$HOME/.config/composer/vendor/bin"
export PATH="$PATH:$DOTFILES_DIR/bin"
export PATH="$PATH:$HOME/bin:$HOME/.config/phpmon/bin:$HOME/.local/bin"
export PATH="/usr/local/opt/ncurses/bin:$PATH"
"""

[plugins.fzf-opts]
inline = 'source "$DOTFILES_DIR/files/home/fzf.sh"'

# ── Completions ──────────────────────────────────────────────────────────
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"

[plugins.compinit]
inline = "autoload -Uz compinit && compinit"

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"

[plugins.ohmyzsh-git]
github = "ohmyzsh/ohmyzsh"
dir = "plugins/git"

[plugins.zsh-artisan]
github = "jessarcher/zsh-artisan"

[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"

# ── Dotfiles + tools ─────────────────────────────────────────────────────
[plugins.aliases]
inline = 'source "$DOTFILES_DIR/files/home/zsh_aliases"'

[plugins.mise]
inline = 'eval "$(mise activate zsh)"'

[plugins.fzf]
inline = 'eval "$(fzf --zsh)"'

[plugins.zoxide]
inline = 'eval "$(zoxide init zsh)"'

[plugins.starship]
inline = 'eval "$(starship init zsh)"'

# ── Keybindings ──────────────────────────────────────────────────────────
# zsh infers its keymap from $EDITOR when neither `bindkey -e` nor `bindkey -v`
# runs. "nvim" matches "vi", so the env plugin above silently selects vi mode
# and Option+Backspace (Esc + ^?) drops to vicmd instead of killing a word.
[plugins.keybindings]
inline = """
bindkey -e
bindkey '^[^?' backward-kill-word
bindkey '^[[1;3D' backward-word
bindkey '^[[1;3C' forward-word
"""
