# Sheldon — https://sheldon.cli.rs
# Locked clones live under ~/.local/share/sheldon/
#
# LOAD ORDER MATTERS — sourced top-to-bottom. Do not reorder casually:
#   1. files/home/zsh/env.zsh
#   2. files/home/fzf.sh (before fzf init)
#   3. zsh-completions on fpath, then files/home/zsh/compinit.zsh
#   4. autosuggestions / other ZLE wrappers
#   5. syntax-highlighting (last among ZLE wrappers)
#   6. files/home/zsh/tools.zsh (aliases, mise, fzf, zoxide, starship)
#   7. files/home/zsh/keybindings.zsh
#   8. files/home/zsh/atuin.zsh last
shell = "zsh"

[plugins.env]
inline = 'source "$DOTFILES_DIR/files/home/zsh/env.zsh"'

[plugins.fzf-opts]
inline = 'source "$DOTFILES_DIR/files/home/fzf.sh"'

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"

[plugins.compinit]
inline = 'source "$DOTFILES_DIR/files/home/zsh/compinit.zsh"'

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"

[plugins.ohmyzsh-git]
github = "ohmyzsh/ohmyzsh"
dir = "plugins/git"

[plugins.zsh-artisan]
github = "jessarcher/zsh-artisan"

[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"

[plugins.tools]
inline = 'source "$DOTFILES_DIR/files/home/zsh/tools.zsh"'

[plugins.keybindings]
inline = 'source "$DOTFILES_DIR/files/home/zsh/keybindings.zsh"'

[plugins.atuin]
inline = 'source "$DOTFILES_DIR/files/home/zsh/atuin.zsh"'
